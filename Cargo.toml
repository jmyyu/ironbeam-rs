[package]
name = "ironbeam-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial, typed async Rust SDK for the Ironbeam futures trading API (REST + WebSocket streaming)"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["/spec/openapi.json"]
keywords = ["ironbeam", "futures", "trading", "websocket", "api"]
categories = ["api-bindings", "finance", "asynchronous"]
# Not published to crates.io; install via path or git dependency.
publish = false

[dependencies]
fastrand = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tracing = "0.1"
url = "2.5"
webpki-roots = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
tokio = { version = "1", features = ["full"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
